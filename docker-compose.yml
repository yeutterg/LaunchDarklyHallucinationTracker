version: '3.8'

services:
  api-server:
    build: .
    container_name: togglebank-api
    ports:
      - "8000:8000"
    environment:
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - LAUNCHDARKLY_AI_CONFIG_KEY=${LAUNCHDARKLY_AI_CONFIG_KEY}
      - LAUNCHDARKLY_LLM_JUDGE_KEY=${LAUNCHDARKLY_LLM_JUDGE_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - API_KEY=${launchdarkly-RAG}
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./.env:/app/.env:ro
    command: ["uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    networks:
      - togglenet

networks:
  togglenet:
    external: true 